<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Papa and Linda in DC</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#1B1B33;font-family:'Open Sans',system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
#hd{position:sticky;top:0;z-index:50;background:#1B1B33;color:#fff;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px}
.ttl{font-family:'Bebas Neue','Open Sans',sans-serif;font-size:24px;font-weight:400;letter-spacing:1.5px;line-height:1;margin:0 2px 7px}
#tabs{display:flex;gap:5px}
#tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;border:0;border-radius:8px;padding:6px 0 5px;background:rgba(255,255,255,.14);color:#fff;font:inherit;cursor:pointer;line-height:1.15}
#tabs button b{display:block;font-size:13px;font-weight:700}
#tabs button span{display:block;font-size:11px;opacity:.85}
#tabs button.on{background:var(--c);color:#fff}
#tabs button.mapb{background:#F0B429;color:#1B1B33}
#tabs button.mapb.on{background:#fff;color:#1B1B33;box-shadow:inset 0 0 0 3px #F0B429}
#dayhead{padding:10px 12px 4px;font-size:12px;color:#6B6B7B}
#dayhead b{color:#1B1B33;font-size:15px}
.tl{position:relative;margin:6px 10px 40px 0}
.hr{position:absolute;left:0;right:0;border-top:1px solid #E6E6EE}
.hr span{position:absolute;left:8px;top:-8px;background:#fff;padding:0 3px;font-size:11px;color:#6B6B7B}
.ev{position:absolute;left:58px;right:0;border-radius:8px;padding:6px 10px 6px;overflow:hidden;font-size:12px;line-height:1.3}
.ev.set{background:var(--t);border-left:4px solid var(--c)}
.ev.open{background:#fff;border:1.5px dashed #9A9AAE}
.ev[data-p]{cursor:pointer}
.ev[data-p]:after{content:'\203A';position:absolute;right:10px;top:6px;font-size:18px;color:var(--c);line-height:1}
.tm{font-size:11px;font-weight:700;color:var(--c)}
.open .tm{color:#6B6B7B}
.tt{font-size:13px;font-weight:700;margin:1px 0 0;padding-right:16px}
.tbc{font-size:10px;font-weight:700;color:#B07F12;margin-left:4px}
.nt{color:#4A4A5E;font-size:12px;margin-top:1px}
.dt{color:#6B6B7B;font-size:11px;margin-top:1px}
.op{list-style:none;margin:5px 0 0;padding:0}
.op li{display:flex;gap:6px;align-items:baseline;padding:5px 0;border-top:1px solid #ECECF2;cursor:pointer}
.op li b{font-size:12px;font-weight:400}
.op li span{color:#6B6B7B;font-size:11px;flex:1}
.op li i{font-style:normal;color:var(--c);font-size:16px;line-height:1}
.op li.na{cursor:default}
.mr{margin-top:4px;font-size:11px;color:var(--c);cursor:pointer;text-decoration:underline}
.ev.now{background:#FFF1CC!important}
.ev.set.now{border-left-color:#F0B429}
.ev.open.now{border:1.5px dashed #D49A06}
.ev.now .tm{color:#8A6200}
.ev.now[data-p]:after{color:#B07F12}
.nowline{position:absolute;left:46px;right:0;height:0;border-top:2px solid #F0B429;z-index:6;pointer-events:none}
.nowline:before{content:'';position:absolute;left:-6px;top:-6px;width:10px;height:10px;border-radius:50%;background:#F0B429}
#splash{position:fixed;inset:0;z-index:999;background:#3C4ED6;transition:opacity .6s ease;cursor:pointer}
#splash img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom}
#splash .st{position:absolute;top:13%;left:0;right:0;text-align:center;color:#fff;padding:0 16px}
#splash .k{font-size:12px;font-weight:700;letter-spacing:4px}
#splash .h{font-family:'Bebas Neue','Open Sans',sans-serif;font-size:64px;letter-spacing:2px;line-height:1;margin:8px 0 10px}
#splash .d{font-size:16px;font-weight:600;letter-spacing:.5px}
#ov{position:fixed;inset:0;background:rgba(27,27,51,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center}
#ov[hidden]{display:none}
#sh{background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px);position:relative}
#sh .sn{font-size:16px;font-weight:700;padding-right:28px}
#sh .sa{font-size:13px;color:#6B6B7B;margin:2px 0 12px}
#sh .sb{display:flex;gap:8px;flex-wrap:wrap}
#sh a.btn{flex:1;min-width:110px;text-align:center;text-decoration:none;padding:11px 8px;border-radius:10px;font-size:14px;font-weight:600;background:#3C4ED6;color:#fff}
#sh a.btn.alt{background:#fff;color:#3C4ED6;border:1.5px solid #3C4ED6}
#x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:26px;color:#6B6B7B;cursor:pointer;line-height:1}
#mapview{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#EEF}
#mapview[hidden]{display:none}
#map{position:absolute;left:0;right:0;bottom:0;top:46px}
#mvbar{position:absolute;left:0;right:0;top:0;height:46px;background:#1B1B33;display:flex;align-items:center;justify-content:center;z-index:1100}
.seg{display:flex;border:1.5px solid rgba(255,255,255,.6);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;color:#fff;font:inherit;font-size:13px;font-weight:600;padding:6px 28px;cursor:pointer}
.seg button.on{background:#fff;color:#1B1B33}
#list{position:absolute;left:0;right:0;bottom:0;top:46px;overflow:auto;background:#fff;padding-bottom:30px}
#list[hidden]{display:none}
.cg{margin:0 0 6px}
.c-Sights{--cc:#3C4ED6;--cx:#fff;--ct:#ECEEFB;--ci:#3C4ED6}
.c-Outdoors{--cc:#2DA44E;--cx:#fff;--ct:#E6F4EA;--ci:#2DA44E}
.c-Fun{--cc:#F0B429;--cx:#1B1B33;--ct:#FFF6DC;--ci:#B07F12}
.c-Food{--cc:#E4572E;--cx:#fff;--ct:#FCEAE4;--ci:#E4572E}
.lh{background:var(--cc);color:var(--cx);font-size:12px;font-weight:700;padding:8px 14px;letter-spacing:.5px}
.li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid #fff;background:var(--ct);cursor:pointer}
.li div{flex:1;min-width:0}
.li b{display:block;font-size:14px;font-weight:600}
.li span.s{display:block;font-size:12px;color:#5A5A6E}
.li i{font-style:normal;color:var(--ci);font-size:20px;line-height:1}
#mapmsg{position:absolute;left:0;right:0;bottom:0;top:46px;padding:30px 20px;font-size:14px;color:#6B6B7B}
#filt{position:absolute;z-index:1000;right:54px;top:56px;height:36px;border:0;border-radius:8px;background:#1B1B33;color:#fff;padding:7px 12px;font:inherit;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.panel{position:absolute;z-index:1000;right:10px;top:100px;background:rgba(27,27,51,.95);color:#fff;border-radius:10px;padding:10px 12px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.35);max-width:230px}
.panel[hidden]{display:none}
#cyc{position:absolute;z-index:1000;right:10px;top:56px;width:36px;height:36px;border:0;border-radius:8px;background:#1B1B33;color:#fff;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer}
.panel label{display:flex;align-items:center;gap:8px;margin:6px 0;cursor:pointer}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;display:inline-block;flex:none}
.panel button{margin:8px 6px 0 0;background:#3C4ED6;color:#fff;border:0;border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
.pin{width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.55)}
.pin.home{width:11px;height:11px;border-width:2px;border-radius:3px;transform:rotate(45deg)}
.lbl{background:rgba(27,27,51,.88);color:#fff;border:0;border-radius:4px;font-size:11px;font-weight:600;padding:2px 6px;box-shadow:none}
.lbl:before{display:none}
.nolabels .lbl{display:none}
.pp b{font-size:14px}
.pp a{display:inline-block;margin:6px 8px 0 0;padding:5px 10px;border-radius:6px;background:#3C4ED6;color:#fff!important;text-decoration:none;font-size:12px;font-weight:600}
.pp a.alt{background:#fff;color:#3C4ED6!important;border:1px solid #3C4ED6}
</style></head><body>

 for(j=0;j<ev.length;j++){var s=mins(ev[j].s),e=ev[j].e?mins(ev[j].e):mins(ev[j].v);ev[j]._s=s;ev[j]._e=e;if(s<min)min=s;if(e>max)max=e;}
 var a0=Math.floor(min/60)*60,a1=Math.ceil(max/60)*60,H=(a1-a0)*PPH/60,html='',m;
 for(m=a0;m<=a1;m+=60){html+='<div class="hr" style="top:'+((m-a0)*PPH/60)+'px"><span>'+h12(m)+'</span></div>';}
 ev.forEach(function(x,k){
  var top=(x._s-a0)*PPH/60+2,hh=(x._e-x._s)*PPH/60-4;
  var tm=x.lbl?x.lbl:(x.e?f12(x.s)+' \u2013 '+f12(x.e):f12(x.s));
  var c='<div class="tm">'+esc(tm)+'</div><div class="tt">'+esc(x.title)+(x.tbc?'<span class="tbc">TBC</span>':'')+'</div>';
  if(x.note)c+='<div class="nt">'+esc(x.note)+'</div>';
  if(x.det)c+='<div class="dt">'+esc(x.det)+'</div>';
  if(x.opts){c+='<ul class="op">';x.opts.forEach(function(op){
    if(op.p){c+='<li data-p="'+op.p+'"><b>'+esc(op.l||P[op.p].n)+'</b>'+(op.n?'<span>'+esc(op.n)+'</span>':'<span></span>')+'<i>\u203A</i></li>';}
    else c+='<li class="na"><b>'+esc(op.t)+'</b><span></span></li>';});
   c+='</ul>';}
  if(x.more)c+='<div class="mr" data-map="1">See more options</div>';
  html+='<div class="ev '+(x.set?'set':'open')+'" data-k="'+k+'"'+(x.p?' data-p="'+x.p+'"':'')+' style="top:'+top+'px;height:'+hh+'px">'+c+'</div>';
 });
 var day=document.getElementById('day');
 day.innerHTML='<div class="tl" style="height:'+H+'px">'+html+'</div>';
 day._a0=a0;
}
function updateNow(){
 var old=document.querySelectorAll('.nowline'),i;for(i=0;i<old.length;i++)old[i].parentNode.removeChild(old[i]);
 var cs=document.querySelectorAll('.ev.now');for(i=0;i<cs.length;i++)cs[i].classList.remove('now');
 if(cur==='map'||tripDay()!==cur)return;
 var n=new Date(),nm=n.getHours()*60+n.getMinutes(),dy=document.getElementById('day'),tl=dy.querySelector('.tl');if(!tl)return;
 var d=DAYS[cur],a0=dy._a0,y=(nm-a0)*(d.pph||PPH0)/60;
 if(y>=0&&y<=tl.offsetHeight){var ln=document.createElement('div');ln.className='nowline';ln.style.top=y+'px';tl.appendChild(ln);}
 d.ev.forEach(function(x,k){if(x._s<=nm&&nm<x._e){var el=tl.querySelector('.ev[data-k="'+k+'"]');if(el)el.classList.add('now');}});
}
function tripDay(){var n=new Date();if(n.getFullYear()===2026&&n.getMonth()===10&&n.getDate()>=6&&n.getDate()<=9)return n.getDate()-6;return -1;}
function show(i,noScroll,view){
 cur=i;
 var mv=document.getElementById('mapview');
 if(i==='map'){
  document.getElementById('day').style.display='none';document.getElementById('dayhead').style.display='none';
  mv.hidden=false;mv.style.top=document.getElementById('hd').offsetHeight+'px';document.documentElement.style.setProperty('--hd',mv.style.top);
  buildList();setMV(view||MV);
 }else{
  mv.hidden=true;document.getElementById('day').style.display='';document.getElementById('dayhead').style.display='';
  var d=DAYS[i];
  document.getElementById('dayhead').innerHTML='<b>'+esc(d.full)+'</b><br>'+esc(d.sub);
  renderDay(i);
  var dy=document.getElementById('day');dy.style.setProperty('--c',d.c);dy.style.setProperty('--t',d.t);
  updateNow();
  if(!noScroll){
   var first=d.ev[0]._s,a0=document.getElementById('day')._a0,y=0,td=tripDay();
   if(td===i){var n=new Date(),nm=n.getHours()*60+n.getMinutes();y=Math.max(0,(nm-a0)*(d.pph||PPH0)/60-60);}
   window.scrollTo(0,y);
  }
 }
 renderTabs();
}
document.getElementById('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var v=b.getAttribute('data-i');show(v==='map'?'map':+v);});
function showSheet(name,addr,btns){
 document.querySelector('#sh .sn').textContent=name;
 document.querySelector('#sh .sa').textContent=addr||'';
 var sb=document.querySelector('#sh .sb');sb.innerHTML='';
 btns.forEach(function(x,i){var a=document.createElement('a');a.className='btn'+(i?' alt':'');a.textContent=x.t;
  if(x.href){a.href=x.href;a.target='_blank';a.rel='noopener';}else{a.href='#';a.onclick=function(ev){ev.preventDefault();x.fn();};}
  sb.appendChild(a);});
 document.getElementById('ov').hidden=false;
}
function openSheet(k){
 var p=P[k];if(!p)return;var b=[];
 if(p.site)b.push({t:'Website',href:p.site});
 b.push({t:'Directions',href:dirUrl(p)});
 if(p.res&&p.res!==p.site)b.push({t:'Reserve',href:p.res});
 showSheet(p.n,p.a,b);
}
function openListSheet(id){
 var d=DATA.filter(function(x){return x.id===id;})[0];if(!d)return;var b=[];
 if(d.link&&d.link.indexOf('google.com/maps')<0)b.push({t:'Website',href:d.link});
 b.push({t:'Directions',href:'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(d.name+' '+d.address)});
 b.push({t:'View on map',fn:function(){document.getElementById('ov').hidden=true;setMV('map');if(window.focusPin)window.focusPin(id);}});
 showSheet(d.name,d.address+(d.notes?' \u00b7 '+d.notes:''),b);
}
var MV='map',listBuilt=false;
function buildList(){
 if(listBuilt)return;listBuilt=true;var h='',order=['Sights','Outdoors','Fun','Food'];
 order.forEach(function(c){var items=DATA.filter(function(x){return x.category===c;});if(!items.length)return;
  h+='<div class="cg c-'+c+'"><div class="lh">'+c.toUpperCase()+'</div>';
  items.forEach(function(x){h+='<div class="li" data-id="'+x.id+'"><div><b>'+esc(x.name)+'</b><span class="s">'+esc(x.address)+(x.notes?' \u00b7 '+esc(x.notes):'')+'</span></div><i>\u203A</i></div>';});h+='</div>';});
 document.getElementById('list').innerHTML=h;
}
function setMV(v){
 MV=v;var lst=document.getElementById('list'),mp=document.getElementById('map'),vis=(v==='map');
 lst.hidden=vis;mp.style.display=vis?'block':'none';
 ['filt','cyc'].forEach(function(id){document.getElementById(id).style.display=vis?'':'none';});
 if(!vis){document.getElementById('panel').hidden=true;document.getElementById('mapmsg').hidden=true;}
 document.getElementById('sgl').className=vis?'':'on';document.getElementById('sgm').className=vis?'on':'';
 if(vis){initMap();if(window.MAP)setTimeout(function(){MAP.invalidateSize();},50);}
}
document.getElementById('mvbar').addEventListener('click',function(e){var b=e.target.closest('button');if(b)setMV(b.getAttribute('data-v'));});
document.getElementById('list').addEventListener('click',function(e){var t=e.target.closest('.li');if(t)openListSheet(t.getAttribute('data-id'));});
document.getElementById('day').addEventListener('click',function(e){
 if(e.target.closest('[data-map]')){show('map',false,'list');return;}

document.getElementById('x').onclick=function(){document.getElementById('ov').hidden=true;};
document.getElementById('ov').addEventListener('click',function(e){if(e.target.id==='ov')document.getElementById('ov').hidden=true;});

var CSV_TEXT="id,name,category,address,lat,lon,day,time,link,notes,coords_source\nhome,Home/Hotel,Home,1760 / 1770 Euclid St NW,38.92255,-77.0417,,,https://www.google.com/maps/search/?api=1&query=The%20LINE%20DC%201770%20Euclid%20St%20NW,\"Our place and the hotel, across the street\",approx\npostal,National Postal Museum,Sights,2 Massachusetts Ave NE,38.89793,-77.00827,,,https://postalmuseum.si.edu/national-postal-museum,Led by Solomon. Open daily 10-5:30. Free,listing\nlincoln,Lincoln Memorial,Sights,West end of the National Mall,38.8893,-77.0502,,,https://www.google.com/maps/search/?api=1&query=Lincoln%20Memorial,Pairs with a Mall walk,approx\nrock-creek,Rock Creek Park (Peirce Mill area),Outdoors,Rock Creek Park,38.9425,-77.0509,,,https://www.nps.gov/rocr,Walk or bike ride. Exact start TBD,approx\nmeridian,Meridian Hill Park,Outdoors,16th St NW and W St NW,38.921,-77.0357,,,https://www.nps.gov/places/meridian-hill-park.htm,Close to the hotel. Check NPS for 2026 closures,approx\nunion-market,Union Market food hall,Fun,1309 5th St NE,38.9082,-76.9987,,,https://unionmarketdc.com,Open daily 8 AM-9 PM,approx\nwingos,Wingo's (Glover Park),Food,2218 Wisconsin Ave NW,38.9235,-77.0743,,,https://www.google.com/maps/search/?api=1&query=Wingo%27s%202218%20Wisconsin%20Ave%20NW%20Washington%20DC,Wings and sports bar. Open from 11 AM,approx\ncapitol-tour,Capitol / monuments hop-on hop-off,Sights,U.S. Capitol,38.8899,-77.0091,,,https://www.google.com/maps/search/?api=1&query=U.S.%20Capitol%20Washington%20DC,Pinned at the Capitol. Tour and tickets TBD,approx\nzaytinya,Zaytinya,Food,701 9th St NW,38.89881,-77.02372,,,https://www.opentable.com/r/zaytinya-dc-washington,\"Sat 11-midnight, Sun 11-10\",listing\nspot,Solomon's spot (National Mall),Outdoors,Pinned location,38.89168387526813,-77.04383658068092,,,https://www.google.com/maps/search/?api=1&query=38.89168387526813%2C-77.04383658068092,Monday. Sit on the Mall,user\ndiner-dc,The Diner (Adams Morgan),Food,2453 18th St NW,38.9217,-77.0422,,,https://dinerdc.com,Monday breakfast option. Open 24 hours,approx\nsuccotash,Succotash Prime,Food,915 F St NW,38.8974,-77.0238,,,https://www.opentable.com/r/succotash-penn-quarter-dc-washington,Monday breakfast option. Opens 11 AM,approx\nflea,Georgetown Flea Market,Fun,1819 35th St NW,38.9139,-77.0683,,,https://www.google.com/maps/search/?api=1&query=Georgetown%20Flea%20Market%201819%2035th%20St%20NW%20Washington%20DC,Sunday option. Open until 4 PM,approx\n";
var COLORS={Sights:'#3C4ED6',Outdoors:'#2DA44E',Fun:'#F0B429',Food:'#E4572E',Home:'#FFFFFF'};
function parseCsv(txt){var rows=[],row=[],cur2='',q=false,i,c;for(i=0;i<txt.length;i++){c=txt[i];if(q){if(c==='"'){if(txt[i+1]==='"'){cur2+='"';i++;}else q=false;}else cur2+=c;}else if(c==='"')q=true;else if(c===','){row.push(cur2);cur2='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(cur2);cur2='';if(row.length>1)rows.push(row);row=[];}else cur2+=c;}if(cur2||row.length){row.push(cur2);rows.push(row);}var h=rows.shift();return rows.map(function(r){var o2={};h.forEach(function(k,j){o2[k]=r[j];});return o2;});}
var DATA=parseCsv(CSV_TEXT);
var mapReady=false;
function initMap(){
 if(mapReady)return;
 if(typeof L==='undefined'||!L.maplibreGL){document.getElementById('mapmsg').hidden=false;return;}
 mapReady=true;
 var data=DATA;
 var attr='<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> &copy; OpenMapTiles Data from <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>';
 function ofm(n){return L.maplibreGL({style:'https://tiles.openfreemap.org/styles/'+n,attribution:attr});}
 var base={'Bright':ofm('bright'),'Dark':ofm('dark'),'Positron':ofm('positron')};
 var map=L.map('map',{layers:[base['Bright']],zoomControl:true});window.MAP=map;

 var order=[base['Bright'],base['Dark'],base['Positron']],bi=0;
 document.getElementById('cyc').onclick=function(){map.removeLayer(order[bi]);bi=(bi+1)%order.length;map.addLayer(order[bi]);};
 map.on('popupopen',function(){document.getElementById('panel').hidden=true;});
 map.on('click',function(){document.getElementById('panel').hidden=true;});
 var groups={},markers=[],byId={};
 data.forEach(function(d){
  var col=COLORS[d.category]||'#999',home=d.category==='Home';
  var icon=L.divIcon({className:'',html:'<div class="pin '+(home?'home':'')+'" style="background:'+col+'"></div>',iconSize:home?[11,11]:[22,22],iconAnchor:home?[6,6]:[11,11]});
  var m=L.marker([+d.lat,+d.lon],{icon:icon,title:d.name});
  m.bindTooltip(d.name,{permanent:true,direction:'right',offset:[12,0],className:'lbl'});
  var isMaps=d.link.indexOf('google.com/maps')>-1;
  var dir='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(d.name+' '+d.address);
  m.bindPopup('<div class="pp"><b>'+d.name+'</b><br>'+d.address+'<br>'+(d.notes||'')+'<br>'+(isMaps?'':'<a href="'+d.link+'" target="_blank" rel="noopener">Website</a>')+'<a'+(isMaps?'':' class="alt"')+' href="'+dir+'" target="_blank" rel="noopener">Directions</a></div>');
  (groups[d.category]=groups[d.category]||L.layerGroup().addTo(map)).addLayer(m);markers.push(m);byId[d.id]=m;
 });
 var cats=document.getElementById('cats');
 function updateTog(){var cb=document.querySelectorAll('#cats input'),all=true,i;for(i=0;i<cb.length;i++)if(!cb[i].checked)all=false;document.getElementById('tog').textContent=all?'Deselect all':'Select all';}
 function setAll(on){Object.keys(groups).forEach(function(c){if(c==='Home')return;on?map.addLayer(groups[c]):map.removeLayer(groups[c]);});var cb=document.querySelectorAll('#cats input');for(var i=0;i<cb.length;i++)cb[i].checked=on;}
 Object.keys(COLORS).forEach(function(c){
  if(!groups[c]||c==='Home')return;
  var l=document.createElement('label');
  l.innerHTML='<input type="checkbox" checked><span class="dot" style="background:'+COLORS[c]+'"></span>'+c;
  l.firstChild.addEventListener('change',function(e){e.target.checked?map.addLayer(groups[c]):map.removeLayer(groups[c]);updateTog();});
  cats.appendChild(l);
 });
 window.focusPin=function(id){var m=byId[id];if(!m)return;var d=data.filter(function(x){return x.id===id;})[0];var g=groups[d.category];if(g&&!map.hasLayer(g)){map.addLayer(g);var lb=document.querySelectorAll('#cats label');for(var i=0;i<lb.length;i++){if(lb[i].textContent.trim()===d.category)lb[i].firstChild.checked=true;}updateTog();}map.setView(m.getLatLng(),16);m.openPopup();};
 function fitAll(){map.fitBounds(L.featureGroup(markers).getBounds().pad(0.12));}
 function fitDowntown(){map.fitBounds([[38.8860,-77.0760],[38.9250,-77.0300]],{padding:[10,10]});}
 function labels(){var on=document.getElementById('lab').checked&&map.getZoom()>=12;document.getElementById('map').classList.toggle('nolabels',!on);}
 document.getElementById('tog').onclick=function(){var cb=document.querySelectorAll('#cats input'),all=true,i;for(i=0;i<cb.length;i++)if(!cb[i].checked)all=false;setAll(!all);updateTog();};
 document.getElementById('all').onclick=fitAll;document.getElementById('dt').onclick=fitDowntown;
 document.getElementById('lab').onchange=labels;map.on('zoomend',labels);
 document.getElementById('filt').onclick=function(e){e.stopPropagation();var p=document.getElementById('panel');p.hidden=!p.hidden;};
 fitDowntown();labels();
}
