<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papa and Linda in DC: options map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
html,body{margin:0;height:100%;font-family:'Open Sans',system-ui,sans-serif}
#map{position:absolute;inset:0}
.panel{position:absolute;z-index:1000;left:12px;top:12px;background:rgba(27,27,51,.92);color:#fff;border-radius:10px;padding:12px 14px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.35);max-width:230px}
.panel h1{font-size:14px;margin:0 0 8px}
.panel label{display:flex;align-items:center;gap:8px;margin:5px 0;cursor:pointer}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;display:inline-block;flex:none}
.panel button{margin:8px 6px 0 0;background:#3C4ED6;color:#fff;border:0;border-radius:6px;padding:5px 9px;font:inherit;cursor:pointer}
.pin{width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.55)}
.pin.home{width:11px;height:11px;border-width:2px;border-radius:3px;transform:rotate(45deg)}
.lbl{background:rgba(27,27,51,.88);color:#fff;border:0;border-radius:4px;font-size:11px;font-weight:600;padding:2px 6px;box-shadow:none}
.lbl:before{display:none}
.nolabels .lbl{display:none}
.popup b{font-size:14px}
.popup a{color:#3C4ED6}
</style></head><body>
<div id="map"></div>
<div class="panel"><h1>Options map</h1><div id="cats"></div>
<label><input type="checkbox" id="lab" checked> Labels</label>
<button id="all">Fit all</button><button id="dt">Downtown</button><br><button id="tog">Deselect all</button></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script>
var STADIA_KEY=''; // optional: free Stadia Maps key adds Toner Dark and Watercolor
var CARTO_KEY='';  // optional: free CARTO key adds Voyager and Dark Matter (carto.com/basemaps/apikey)
var CSV_TEXT="id,name,category,address,lat,lon,day,time,link,notes,coords_source\nhome,Home/Hotel,Home,1760 / 1770 Euclid St NW,38.92255,-77.0417,,,https://www.google.com/maps/search/?api=1&query=The%20LINE%20DC%201770%20Euclid%20St%20NW,\"Our place and the hotel, across the street\",approx\nnat-geo,National Geographic Museum,Sights,1145 17th St NW,38.90515,-77.03811,,,https://www.google.com/maps/search/?api=1&query=National%20Geographic%20Museum%201145%2017th%20St%20NW,Near the HR&A office. Tickets and hours TBC,listing\npostal,National Postal Museum,Sights,2 Massachusetts Ave NE,38.89793,-77.00827,,,https://postalmuseum.si.edu/national-postal-museum,Led by Solomon. Open daily 10-5:30. Free,listing\nnga,National Gallery of Art,Sights,Constitution Ave NW,38.8913,-77.0199,,,https://www.nga.gov,Open daily 10-5. Free,approx\nlincoln,Lincoln Memorial,Sights,West end of the National Mall,38.8893,-77.0502,,,https://www.google.com/maps/search/?api=1&query=Lincoln%20Memorial,Pairs with a Mall walk,approx\nhra,HR&A office,Sights,1700 K St NW,38.9026,-77.0388,,,https://www.google.com/maps/search/?api=1&query=1700%20K%20St%20NW%20Washington%20DC,Weekend visit,approx\nrock-creek,Rock Creek Park (Peirce Mill area),Outdoors,Rock Creek Park,38.9425,-77.0509,,,https://www.nps.gov/rocr,Walk or bike ride. Exact start TBD,approx\nmeridian,Meridian Hill Park,Outdoors,16th St NW and W St NW,38.9178,-77.0366,,,https://www.google.com/maps/search/?api=1&query=Meridian%20Hill%20Park,Close to the hotel,approx\nhains,Hains Point,Outdoors,East Potomac Park,38.8587,-77.0285,,,https://www.google.com/maps/search/?api=1&query=Hains%20Point%20East%20Potomac%20Park,Good for a drive or walk,approx\npoplar,Poplar Point,Outdoors,Anacostia,38.864,-76.996,,,https://www.google.com/maps/search/?api=1&query=Poplar%20Point%20Anacostia,Solomon is working on a project here,approx\nunion-market,Union Market food hall,Fun,1309 5th St NE,38.9082,-76.9987,,,https://www.google.com/maps/search/?api=1&query=Union%20Market%201309%205th%20St%20NE,Hours TBC,approx\ntopgolf,Topgolf National Harbor,Fun,\"National Harbor, MD\",38.788,-77.003,,,https://www.google.com/maps/search/?api=1&query=Topgolf%20National%20Harbor%20MD,Availability and drive time TBC,approx\nold-town,Old Town Alexandria,Fun,\"King St and the waterfront, VA\",38.8048,-77.0469,,,https://www.google.com/maps/search/?api=1&query=Old%20Town%20Alexandria%20VA,Across the river,approx\npost-tower,Old Post Office Tower,Sights,1100 Pennsylvania Ave NW,38.893715,-77.027756,,,https://www.nps.gov/thingstodo/old-post-office-tower.htm,Best view in the city. Open 9 AM-1 PM. Free,listing\nwingos,Wingo's (Glover Park),Food,2218 Wisconsin Ave NW,38.9235,-77.0743,,,https://www.google.com/maps/search/?api=1&query=Wingo%27s%202218%20Wisconsin%20Ave%20NW%20Washington%20DC,Wings and sports bar. Open from 11 AM,approx\nbread-furst,Bread Furst,Food,4434 Connecticut Ave NW,38.9466,-77.064,,,https://breadfurst.com/,Opens 7 AM daily,approx\nebbitt,Old Ebbitt Grill,Food,675 15th St NW,38.89804,-77.033264,,,https://www.opentable.com/old-ebbitt-grill-reservations-washington,Reservations suggested,listing\nfounding-farmers,Founding Farmers,Food,1924 Pennsylvania Ave NW,38.900329,-77.044517,,,https://www.opentable.com/r/founding-farmers-dc-washington,Reservations suggested,listing\nzaytinya,Zaytinya,Food,701 9th St NW,38.89881,-77.02372,,,https://www.opentable.com/r/zaytinya-dc-washington,\"Sat 11-midnight, Sun 11-10\",listing\nrevelers,Reveler's Hour,Food,1775 Columbia Rd NW,38.923421,-77.042095,,,https://www.opentable.com/r/revelers-hour-washington,Dinner. Pasta and wine,listing\n";
var COLORS={Sights:'#3C4ED6',Outdoors:'#2DA44E',Fun:'#F0B429',Food:'#E4572E',Home:'#FFFFFF'};
function parseCsv(txt){var rows=[],row=[],cur='',q=false,i,c;for(i=0;i<txt.length;i++){c=txt[i];if(q){if(c==='"'){if(txt[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}else if(c==='"')q=true;else if(c===','){row.push(cur);cur='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(cur);cur='';if(row.length>1)rows.push(row);row=[];}else cur+=c;}if(cur||row.length){row.push(cur);rows.push(row);}var h=rows.shift();return rows.map(function(r){var o={};h.forEach(function(k,j){o[k]=r[j];});return o;});}
var data=parseCsv(CSV_TEXT);
var attrOFM='<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> &copy; <a href="https://www.openmaptiles.org/" target="_blank">OpenMapTiles</a> Data from <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>';
var attrOSM='&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
function ofm(name){return L.maplibreGL({style:'https://tiles.openfreemap.org/styles/'+name,attribution:attrOFM});}
var base={
 'Bright':ofm('bright'),
 'Dark':ofm('dark'),
 'Positron':ofm('positron')
};
if(CARTO_KEY){
 var ck='?key='+CARTO_KEY,ac=attrOSM+' &copy; <a href="https://carto.com/attributions">CARTO</a>';
 base['Voyager (CARTO)']=L.tileLayer('https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png'+ck,{attribution:ac,maxZoom:19});
 base['Dark Matter (CARTO)']=L.tileLayer('https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png'+ck,{attribution:ac,maxZoom:19});
}
if(STADIA_KEY){
 var sk='?api_key='+STADIA_KEY,as='&copy; <a href="https://stadiamaps.com/">Stadia Maps</a> &copy; <a href="https://stamen.com/">Stamen Design</a> '+attrOSM;
 base['Toner Dark (Stadia)']=L.tileLayer('https://tiles.stadiamaps.com/tiles/stamen_toner_dark/{z}/{x}/{y}.png'+sk,{attribution:as,maxZoom:19});
 base['Watercolor (Stadia)']=L.tileLayer('https://tiles.stadiamaps.com/tiles/stamen_watercolor/{z}/{x}/{y}.jpg'+sk,{attribution:as,maxZoom:16});
}
var map=L.map('map',{layers:[base['Bright']],zoomControl:true});
L.control.layers(base,null,{collapsed:false,position:'topright'}).addTo(map);
var groups={},markers=[];
data.forEach(function(d){
 var col=COLORS[d.category]||'#999';
 var icon=L.divIcon({className:'',html:'<div class="pin '+(d.category==='Home'?'home':'')+'" style="background:'+col+'"></div>',iconSize:d.category==='Home'?[11,11]:[22,22],iconAnchor:d.category==='Home'?[6,6]:[11,11]});
 var m=L.marker([+d.lat,+d.lon],{icon:icon,title:d.name});
 m.bindTooltip(d.name,{permanent:true,direction:'right',offset:[12,0],className:'lbl'});
 m.bindPopup('<div class="popup"><b>'+d.name+'</b><br>'+d.address+'<br>'+(d.notes||'')+'<br><a href="'+d.link+'" target="_blank" rel="noopener">Link</a></div>');
 (groups[d.category]=groups[d.category]||L.layerGroup().addTo(map)).addLayer(m);
 markers.push(m);
});
var cats=document.getElementById('cats');
Object.keys(COLORS).forEach(function(c){
 if(!groups[c]||c==='Home')return;
 var l=document.createElement('label');
 l.innerHTML='<input type="checkbox" checked><span class="dot" style="background:'+COLORS[c]+'"></span>'+c;
 l.firstChild.addEventListener('change',function(e){e.target.checked?map.addLayer(groups[c]):map.removeLayer(groups[c]);updateTog();});
 cats.appendChild(l);
});
function fitAll(){map.fitBounds(L.featureGroup(markers).getBounds().pad(0.12));}
function fitDowntown(){map.fitBounds([[38.8860,-77.0760],[38.9250,-77.0300]],{padding:[10,10]});}
function setAll(on){Object.keys(groups).forEach(function(c){if(c==='Home')return;on?map.addLayer(groups[c]):map.removeLayer(groups[c]);});var cb=document.querySelectorAll('#cats input');for(var i=0;i<cb.length;i++)cb[i].checked=on;}
function updateTog(){var cb=document.querySelectorAll('#cats input'),all=true,i;for(i=0;i<cb.length;i++)if(!cb[i].checked)all=false;document.getElementById('tog').textContent=all?'Deselect all':'Select all';}
function labels(){var on=document.getElementById('lab').checked&&map.getZoom()>=12;document.getElementById('map').classList.toggle('nolabels',!on);}
document.getElementById('tog').onclick=function(){var cb=document.querySelectorAll('#cats input'),all=true,i;for(i=0;i<cb.length;i++)if(!cb[i].checked)all=false;setAll(!all);updateTog();};document.getElementById('all').onclick=fitAll;document.getElementById('dt').onclick=fitDowntown;
document.getElementById('lab').onchange=labels;map.on('zoomend',labels);
fitDowntown();labels();
</script></body></html>
